[package]
name = "tigirl-tsf-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "TSF Tigirl sentence bench: foreground SendInput track + private-desktop OnKeyDown track"

[[bin]]
name = "tigirl-tsf-bench"
path = "src/main.rs"

[[bin]]
name = "probe"
path = "src/bin/probe.rs"

[[bin]]
name = "bgdrive"
path = "src/bin/bgdrive.rs"

[dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_LibraryLoader",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_StationsAndDesktops",
    "Win32_Security",
] }
windows-core = "0.58"

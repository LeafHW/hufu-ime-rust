# GNU 使用 rustup 的 GCC CRT 启动对象及 rust-lld；导入库/libgcc 由
# 构建环境提供，不写入作者机器路径。推荐先 dot-source
# platform/windows/arm64x/Initialize-Toolchain.ps1。
# 自定义 LLVM MinGW 链仍可显式覆盖 CARGO_TARGET_*_LINKER/RUSTFLAGS；
# 只有该旧链路需要 --features llvm-mingw-entry。
[target.x86_64-pc-windows-gnu]
linker = "rust-lld.exe"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "link-self-contained=yes"]

[target.i686-pc-windows-gnu]
linker = "rust-lld.exe"
rustflags = ["-C", "linker-flavor=ld.lld", "-C", "link-self-contained=yes"]

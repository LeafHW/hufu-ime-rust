# 虎符皮肤「hufu-default」（迷雾改）→ fcitx5 主题
# 由 platform/linux/theme/build-themes.py 从 engine/crates/hufu-server/official-skins/hufu-default.json 生成，
# **不要手改**：改皮肤源或改转换脚本后重跑，`checks/check-themes.sh` 会比对。
# 映射与取舍（模糊/动效/每候选配色/字体不做）见 platform/linux/theme/README.md。

[Metadata]

# 虎符（hufu-ime）fcitx5 addon 元数据（安装为 /usr/share/fcitx5/addon/hufu.conf）
# 键集与系统示例（/usr/share/fcitx5/addon/table.conf 等）一致。
[Addon]
Name=hufu
Name[zh_CN]=虎符
Name[zh_TW]=虎符
# addon 类别（InputMethod = 输入法引擎）
Category=InputMethod
Version=0.1.0
# 动态库名（不含前缀/后缀；安装为 /usr/lib/fcitx5/libhufu.so）
Library=libhufu
Type=SharedLibrary
# 按需加载（首次使用输入法时加载）
OnDemand=True
# 设置界面（fcitx5-configtool「虎符」页：行为/标点/滤镜/整句/反查/音效/选重翻页）
# 同一份配置：页面打开时从 hufu-server 拉取、保存时深合并写回（热生效）；
# 引擎设置的全部项目另见虎符 Web 设置页（http://127.0.0.1:4390/）
Configurable=True

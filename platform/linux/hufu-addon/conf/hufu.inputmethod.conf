# 输入法条目（安装为 /usr/share/fcitx5/inputmethod/hufu.conf；键集见系统 rime.conf/table.conf）
[InputMethod]
Name=hufu
Name[en_US]=HuFu
Name[zh_CN]=虎符
Name[zh_TW]=虎符
# 图标随包自带（platform/linux/branding/，装到 hicolor 图标主题；主题名 hufu）
# ——不复用 fcitx-tiger：那个来自 fcitx5-chinese-addons，缺包时是缺图占位
Icon=hufu
# 状态栏显示字符
Label=符
LangCode=zh_CN
Addon=hufu
# 图形配置：设置页由 addon 的配置 schema 生成（fcitx5-configtool → 虎符 →
# 配置；读写 conf/hufu.conf，引擎映射项与 Web 设置页同源）
Configurable=True

[workspace]
resolver = "2"
members = [
    "crates/hufu-types",
    "crates/hufu-dict",
    "crates/hufu-engine",
    "crates/hufu-sentence",
    "crates/hufu-config",
    "crates/hufu-skin",
    "crates/hufu-server",
    "crates/hufu-cli",
    "crates/hufu-rerank",
    "crates/hufu-render-helper",
]
# rerank-sidecar 是独立 MSVC 工程（candle 依赖需 dlltool/msvc），不入 GNU 工作区
exclude = ["rerank-sidecar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
thiserror = "2"
# 【SSF 皮肤 M1】容器解析三件套：AES-256-CBC（搜狗 Skin-v3）、
# zlib/deflate（v3 内层 + 明文 ZIP）、sha2（server 指纹）。全部纯 Rust，
# 只进 hufu-skin/hufu-server（x64），i686-gnu DLL 不依赖。
aes = "0.8"
cbc = "0.1"
flate2 = "1"
sha2 = "0.10"
# 【QPYS 2026-10-16】QQ输入法 .qpys 皮肤内层是 OLE 复合文档（FSPQ 偏移
# 0x114 起），标准 CFB 目录树直出「文件名→流」。仅 hufu-skin（server 链）。
cfb = "0.10"

[profile.release]
lto = "fat"
codegen-units = 1

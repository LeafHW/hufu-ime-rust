[workspace]
resolver = "2"
members = [
    "crates/hufu-types",
    "crates/hufu-dict",
    "crates/hufu-engine",
    "crates/hufu-sentence",
    "crates/hufu-config",
    "crates/hufu-skin",
    "crates/hufu-server",
    "crates/hufu-cli",
    "crates/hufu-rerank",
    "crates/hufu-render-helper",
]
# rerank-sidecar 是独立 MSVC 工程（candle 依赖需 dlltool/msvc），不入 GNU 工作区
exclude = ["rerank-sidecar"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
thiserror = "2"
# 【SSF 皮肤 M1】容器解析三件套：AES-256-CBC（搜狗 Skin-v3）、
# zlib/deflate（v3 内层 + 明文 ZIP）、sha2（server 指纹）。全部纯 Rust，
# 只进 hufu-skin/hufu-server（x64），i686-gnu DLL 不依赖。
aes = "0.8"
cbc = "0.1"
flate2 = "1"
sha2 = "0.10"
# 【QPYS 2026-10-16】QQ输入法 .qpys 皮肤内层是 OLE 复合文档（FSPQ 偏移
# 0x114 起），标准 CFB 目录树直出「文件名→流」。仅 hufu-skin（server 链）。
cfb = "0.10"
# 【P1 云同步 2026-10-28】WebDAV 同步客户端件（仅 hufu-server）：aes-gcm
# +pbkdf2=可选口令端到端加密（云端只见密文）；getrandom=盐/nonce。
# ureq 不入 workspace：Windows/unix 特性不同（见 hufu-server Cargo.toml
# ——Windows 必须 native-tls/schannel，本仓零 C 工具链红线，rustls/ring
# 需 gcc 会破坏发行链）。详见 hufu-server\src\sync.rs 模块头。
aes-gcm = "0.10"
pbkdf2 = "0.11"
hmac = "0.12"
getrandom = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1

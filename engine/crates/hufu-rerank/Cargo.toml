[package]
name = "hufu-rerank"
version = "0.1.0"
edition = "2021"

[dependencies]
gemm = "0.19"
rayon = "1"
memmap2 = "0.9"
hufu-types = { path = "../hufu-types" }
hufu-dict = { path = "../hufu-dict" }
hufu-config = { path = "../hufu-config" }
hufu-engine = { path = "../hufu-engine" }
hufu-sentence = { path = "../hufu-sentence" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Memory"] }

[[bin]]
name = "rerank-bench"
path = "src/bin/bench.rs"

[[bin]]
name = "sentence-bench"
path = "src/bin/sentence_bench.rs"

[[bin]]
name = "score-probe"
path = "src/bin/score_probe.rs"

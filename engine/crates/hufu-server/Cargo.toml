[package]
name = "hufu-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hufu-server"
path = "src/main.rs"

[features]
# console = 保留控制台子系统构建（调试/特殊部署）；默认 GUI 子系统，
# 任何方式拉起（HKCU Run / DLL / explorer）都不再弹终端窗。
default = []
console = []

[dependencies]
hufu-types = { path = "../hufu-types" }
hufu-dict = { path = "../hufu-dict" }
hufu-config = { path = "../hufu-config" }
hufu-engine = { path = "../hufu-engine" }
hufu-sentence = { path = "../hufu-sentence" }
hufu-skin = { path = "../hufu-skin" }
hufu-rerank = { path = "../hufu-rerank" }
serde = { workspace = true }
serde_json = { workspace = true }
# 【SSF 皮肤 2026-12】源指纹 sha256（fp = "{size}-{sha256 前 16 hex}"；
# 只在解包时算一次，经 manifest.json 复用——skin op 每次 2.5s 例行
# 轮询不重复读源文件全量哈希）。
sha2 = "0.10"
# 【T7b·server 代画挂件】沉浸宿主（UWP/开始菜单）候选窗挂件的解码/
# 逐帧处理管线（GIF/APNG/WebP/JPEG）——与 DLL hufu-tsf 同版本同特性集
#（2026-11 jpeg 入集：用户反馈挂件不能用 JPG）。
image = { version = "0.25", default-features = false, features = ["png", "gif", "webp", "jpeg"] }
# 【旧版控制台真光标 2026-10-15】console_caret op：AttachConsole 到宿主
# 客户端进程读光标（DLL 载在 conhost 内自读双通道皆死，只能借外部进程）。
# 【P1 云同步 2026-10-28】sha2=文件指纹；getrandom=设备名后缀。
#（aes-gcm/pbkdf2/hmac 随「加密口令」功能移除 2026-10-30 一并卸载）
getrandom = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
] }
# 【云同步 TLS 选型 2026-10-28】Windows 走 native-tls（schannel 纯 Rust
# 绑定，系统证书库/企业代理兼容）：本仓发行链零 C 工具链（rustc gnu
# self-contained），rustls/ring 需 gcc.exe 会直接构建失败（实测）。
# 默认特性全关（gzip 不需要——自家同步包固定 JSON，不请求压缩）。
ureq = { version = "2", default-features = false, features = ["native-tls"] }

[target.'cfg(unix)'.dependencies]
# unix 链（Linux 自带 gcc）：rustls。
ureq = { version = "2", default-features = false, features = ["tls"] }

  p { margin: 0 0 28px; color: #71695a; font-size: 14px; }
  @media (prefers-color-scheme: dark) { p { color: #9d9484; } }
  a { display: inline-flex; align-items: center; gap: 8px; padding: 13px 22px; border-radius: 999px; background: #1a1813; color: #f8f2e4; text-decoration: none; font-size: 14px; font-weight: 600; }
